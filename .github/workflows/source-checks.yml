name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source syntax, links and publication hygiene
        run: python3 scripts/check_source.py
      - name: Server reference closure and isolated regressions
        run: |
          python3 -I -B server/tools/build_reference.py --check
          python3 -I -B tests/server/run.py
          bash -n native/build-native.sh
      - name: Monitoring, DDNS and maintenance (mocked IO)
        run: |
          python3 -I -B monitor/check.py
          python3 -I -B ddns/check.py
          python3 -I -B maintenance/check.py
          node --test monitor/uploader/check-loop.mjs
          cd web
          npm ci
          npm test
